<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">按书配置人物与固定配音</title>
  <desc id="desc">依次选择书籍、手动添加已知人物、保存人物的配音绑定。人物需由用户配置，此示意不表示自动发现人物。声音池重排或重启不会重新分配已有绑定。</desc>
  <rect width="1200" height="300" rx="24" fill="#F4F7F5"/>

  <g id="choose-book" transform="translate(200 102)" fill="none" stroke="#005B57" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-46 -42 H34 A10 10 0 0 1 44 -32 V42 H-34 A12 12 0 0 1 -46 30 Z" fill="#EBF6F1"/>
    <path d="M-46 30 Q-46 18 -34 18 H44 M-23 -42 V18"/>
    <path d="M-2 -19 H24 M-2 -3 H16" stroke="#007770"/>
  </g>

  <g id="known-characters" transform="translate(600 102)" fill="none" stroke="#005B57" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-16" cy="-23" r="22" fill="#EBF6F1"/>
    <path d="M-58 43 V30 C-58 -1 26 -1 26 30 V43" fill="#EBF6F1"/>
    <path d="M25 -42 A22 22 0 0 1 25 -1 M40 11 Q65 15 65 36 V43"/>
    <path d="M-34 43 H2" stroke="#BE5C2A"/>
  </g>

  <g id="saved-voice" transform="translate(1000 102)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-49 -44 H42 A18 18 0 0 1 60 -26 V22 A18 18 0 0 1 42 40 H-10 L-38 59 V40 H-49 A18 18 0 0 1 -67 22 V-26 A18 18 0 0 1 -49 -44 Z" fill="#005B57"/>
    <g fill="none" stroke="#EBF6F1" stroke-width="7">
      <path d="M-39 7 V-11 M-21 17 V-21 M15 17 V-21 M33 7 V-11"/>
      <path d="M-3 27 V-31" stroke="#F0A87C"/>
    </g>
  </g>

  <g id="sequence" fill="none" stroke="#8CA89F" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M316 104 H446 M433 91 L446 104 L433 117 M730 104 H860 M847 91 L860 104 L847 117"/>
  </g>
  <g id="step-labels" fill="#202D33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="54" font-weight="600" text-anchor="middle">
    <text x="200" y="242">选择书籍</text>
    <text x="600" y="242">添加人物</text>
    <text x="1000" y="242">固定配音</text>
  </g>
</svg>
